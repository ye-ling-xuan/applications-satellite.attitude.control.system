[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite-attitude-control"
version = "0.1.0"
description = "Reproducible single-axis traditional and residual RL attitude control"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
rl = ["gymnasium>=1.0,<2", "stable-baselines3>=2.7,<3", "torch>=2.2,<3"]
plot = ["matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["attitude_control*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
