   </g>
   <g id="text_12">
    <text style="fill: #233a4c; font: 12px 'Microsoft YaHei'" transform="translate(94.221 545.31139)">A：原分布全新样本</text>
    <text style="fill: #233a4c; font: 12px 'Microsoft YaHei'" transform="translate(94.221 565.561015)">B：增加初始小振动</text>
    <text style="fill: #233a4c; font: 12px 'Microsoft YaHei'" transform="translate(94.221 585.81064)">C：初始小振动＋假定高斯测量噪声</text>
    <text style="fill: #233a4c; font: 12px 'Microsoft YaHei'" transform="translate(94.221 606.060265)">不同控制器复用相同场景和规定噪声</text>
   </g>
   <g id="text_13">
    <text style="fill: #183e5a; font: 700 14px 'Microsoft YaHei'; text-anchor: start" x="407.259" y="512.987972" transform="rotate(-0 407.259 512.987972)">测试规模与分组统计</text>
   </g>
   <g id="text_14">
    <text style="fill: #233a4c; font: 12px 'Microsoft YaHei'" transform="translate(407.259 545.31139)">每组128初态 × 5种频率＝640场景</text>
    <text style="fill: #233a4c; font: 12px 'Microsoft YaHei'" transform="translate(407.259 565.561015)">3组 × 9控制器 × 640＝17,280回合</text>
    <text style="fill: #233a4c; font: 12px 'Microsoft YaHei'" transform="translate(407.259 585.81064)">统计按128初态成组，复用5频率</text>
    <text style="fill: #233a4c; font: 12px 'Microsoft YaHei'" transform="translate(407.259 606.060265)">18项主要比较；配对重采样200,000次</text>
   </g>
  </g>
  <g id="text_15">
   <text style="font: 700 18px 'Microsoft YaHei'; text-anchor: middle" x="363.6" y="21.58875" transform="rotate(-0 363.6 21.58875)">柔性附件实验设置与持续停稳判据</text>
  </g>
  <g id="text_16">
   <text style="font: 11px 'Microsoft YaHei'" transform="translate(7.2 734.433719)">这是测试设计图，不是性能结果。组间初态独立抽取，不将组间差异作单因素因果解释。</text>
   <text style="font: 11px 'Microsoft YaHei'" transform="translate(7.2 747.72)">控制代价为完整22秒的力矩平方积分，单位(N·m)²·s；不等于实际电能。</text>
